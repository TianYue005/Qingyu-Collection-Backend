spring:
  application:
    name: tradingPlatform
  profiles:
    active: dev
  servlet:
    multipart:
      max-request-size: 25MB
      max-file-size: 25MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/tradingplatfrom?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
mybatis:
  type-handlers-package: com.wang.tradingplatform.utils
  configuration:
    map-underscore-to-camel-case: true # 开启下环线转驼峰命名
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印sql日志
jwt:
  secret: ${jwt.secret}
  expiration: ${jwt.expiration}
  tokenTitle: Authorization