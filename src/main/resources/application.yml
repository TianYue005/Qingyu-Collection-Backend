spring:
  application:
    name: tradingPlatform
  profiles:
    active: dev
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/trading_platform?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${spring.datasource.username}
    password: ${spring.datasource.password}
mybatis:
  configuration:
    map-underscore-to-camel-case: true # 开启下环线转驼峰命名
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印sql日志
jwt:
  secret: ${jwt.secret}
  expiration: ${jwt.expiration}
  tokenHead: Bearer
  tokenTitle: Authorization